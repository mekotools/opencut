name: spiegel

# Spiegelt ein MeKo-Tool-Abbild digest-gepinnt nach ghcr.io/mekotools/<name>.
# Der Push MUSS aus diesem Repo heraus passieren: nur so wird das Paket mit
# einem oeffentlichen Repo verknuepft und ist damit ohne Anmeldung ziehbar.
on:
  workflow_dispatch:
    inputs:
      quelle:
        description: "Quell-Referenz, digest-gepinnt"
        required: true
      ziel:
        description: "Ziel-Paket, z. B. mekotools/turbowarp"
        required: true
      tag:
        description: "Zusätzliches Versionsetikett"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  spiegel:
    runs-on: ubuntu-latest
    steps:
      - name: Prüfen, dass die Quelle digest-gepinnt ist
        run: |
          case "${{ inputs.quelle }}" in
            *@sha256:*) echo "ok: ${{ inputs.quelle }}" ;;
            *) echo "::error::Quelle muss @sha256: enthalten"; exit 1 ;;
          esac
      - name: Spiegeln
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull  "${{ inputs.quelle }}"
          docker tag   "${{ inputs.quelle }}" "ghcr.io/${{ inputs.ziel }}:${{ inputs.tag }}"
          docker tag   "${{ inputs.quelle }}" "ghcr.io/${{ inputs.ziel }}:latest"
          docker push  "ghcr.io/${{ inputs.ziel }}:${{ inputs.tag }}"
          docker push  "ghcr.io/${{ inputs.ziel }}:latest"
