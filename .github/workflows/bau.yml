name: Bau

# Baut OpenCut aus dem festgenagelten Zwischenstand und schiebt das Abbild nach
# ghcr.io/mekotools/opencut. Der Kopf des Quelltextarchivs uebersetzt nicht
# (Importe auf Symbole, die es nie gab); 6ec818fc ist der letzte Stand, der die
# Bauvorschrift des Projekts noch enthaelt und die kaputte Datei noch nicht.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bau:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext festgenagelt holen
        uses: actions/checkout@v4
        with:
          repository: OpenCut-app/opencut-classic
          ref: 6ec818fc11334092dd2d068b2735d04aa0ff04e4

      - name: Fremde Verweise entfernen
        run: |
          set -eu
          python3 - <<'PY'
          import sys
          fehler = []

          # 1. Analysedienst: Zeilenblock von <Script bis zum schliessenden />
          p = "apps/web/src/app/layout.tsx"
          s = open(p, encoding="utf8").read()
          if "cdn.databuddy.cc" in s:
              zeilen = s.splitlines(keepends=True)
              start = ende = None
              for i, z in enumerate(zeilen):
                  if "cdn.databuddy.cc" in z:
                      j = i
                      while j > 0 and "<Script" not in zeilen[j]:
                          j -= 1
                      start = j
                      k = i
                      while k < len(zeilen) - 1 and "/>" not in zeilen[k]:
                          k += 1
                      ende = k
                      break
              if start is None:
                  fehler.append("Analysedienst: Block nicht gefunden")
              else:
                  del zeilen[start:ende + 1]
                  rest = "".join(zeilen)
                  if "databuddy" in rest:
                      fehler.append("Analysedienst blieb stehen")
                  else:
                      open(p, "w", encoding="utf8").write(rest)
                      print("entfernt: Analysedienst cdn.databuddy.cc")
          else:
              print("Hinweis: Analysedienst stand nicht mehr im Quelltext")

          # 2. Laufzeitabfrage bei Google (Schriftauswahl im Editor)
          g = "apps/web/src/fonts/google-fonts.ts"
          t = open(g, encoding="utf8").read()
          alt = 'const GOOGLE_FONTS_CSS = "https://fonts.googleapis.com/css2";'
          if "fonts.googleapis.com" in t:
              if alt not in t:
                  fehler.append("Google-Schriften: Zeile nicht gefunden")
              else:
                  t2 = t.replace(alt, 'const GOOGLE_FONTS_CSS = "about:blank";')
                  if "fonts.googleapis.com" in t2:
                      fehler.append("Google-Schriften liessen sich nicht abschalten")
                  else:
                      open(g, "w", encoding="utf8").write(t2)
                      print("abgeschaltet: fonts.googleapis.com")
          else:
              print("Hinweis: Google-Schriften standen nicht mehr im Quelltext")

          if fehler:
              print("FEHLER: " + "; ".join(fehler))
              sys.exit(1)
          print("Bereinigung in Ordnung")
          PY

      - name: Auslieferadresse einsetzen (mit Ankerpruefung)
        run: |
          set -eu
          grep -q 'ENV NEXT_PUBLIC_SITE_URL="http://localhost:3000"' apps/web/Dockerfile
          sed -i 's|ENV NEXT_PUBLIC_SITE_URL="http://localhost:3000"|ENV NEXT_PUBLIC_SITE_URL="https://opencut.mekotools.de"|' apps/web/Dockerfile
          grep -n 'NEXT_PUBLIC_SITE_URL' apps/web/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/mekotools/opencut:latest
            ghcr.io/mekotools/opencut:ci-${{ github.run_number }}
          build-args: |
            FREESOUND_CLIENT_ID=
            FREESOUND_API_KEY=
            NEXT_PUBLIC_MARBLE_API_URL=http://127.0.0.1
            MARBLE_WORKSPACE_KEY=unused
